[databases]
saleor = host=db port=5432 dbname=saleor

[pgbouncer]
# Connection pooling mode
# - session: Server is released back to pool after client disconnects (default)
# - transaction: Server is released back to pool after transaction finishes (recommended for Django)
# - statement: Server is released back to pool after query completes (not recommended for Django)
pool_mode = transaction

# Maximum number of client connections
max_client_conn = 1000

# Default pool size per user/database pair
default_pool_size = 25

# Minimum number of server connections to keep in pool
min_pool_size = 5

# Maximum number of server connections per database
reserve_pool_size = 5

# How many additional connections can be allowed to the pool temporarily
reserve_pool_timeout = 3

# Maximum number of server connections to allow per user/database pair
max_db_connections = 100

# Maximum number of connections per user
max_user_connections = 100

# Listen on all interfaces
listen_addr = 0.0.0.0
listen_port = 6432

# Authentication type
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Connection handling
server_idle_timeout = 600
server_lifetime = 3600
server_connect_timeout = 15
query_timeout = 0
query_wait_timeout = 120
client_idle_timeout = 0
idle_transaction_timeout = 0

# Logging
admin_users = saleor
stats_users = saleor

# Log settings
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

# Performance tuning
pkt_buf = 8192
max_packet_size = 2147483647
