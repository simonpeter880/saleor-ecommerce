mutation CheckoutDeliveryMethodUpdate($checkoutId: ID!, $deliveryMethodId: ID!) {
	checkoutDeliveryMethodUpdate(id: $checkoutId, deliveryMethodId: $deliveryMethodId) {
		checkout {
			id
			shippingMethod {
				id
				name
			}
			shippingPrice {
				gross {
					amount
					currency
				}
			}
			totalPrice {
				gross {
					amount
					currency
				}
			}
		}
		errors {
			field
			message
			code
		}
	}
}
